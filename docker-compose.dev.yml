# Cert_EET — INF03 — DEV override
# Hot reload (source bind-mounts), development image stage, debug ports exposed.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    build:
      target: development
    environment:
      NODE_ENV: development
      # --- Email / SMTP (US-CPT-05) : l'api envoie ses emails via Mailhog ---
      # "mailhog" = nom du service ci-dessous, résolu sur le réseau interne Docker.
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_FROM: "Cert_EET <no-reply@cert-eet.local>"
      # Base publique du site = origine Nginx (https://localhost), là où le
      # frontend est servi ET où /api est proxifié.
      APP_BASE_URL: "https://localhost"
      # --- OAuth Google (US-AUTH-14) ---
      # Les identifiants viennent du .env racine (jamais committés).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Callback = origine Nginx (là où /api est proxifié et le cookie utilisable).
      GOOGLE_CALLBACK_URL: "https://localhost/api/auth/oauth/google/callback"
      # --- OAuth GitHub (US-AUTH-14 — 2e fournisseur) ---
      # Mêmes identifiants depuis le .env racine (jamais committés).
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: "https://localhost/api/auth/oauth/github/callback"
      # --- Rechargement à chaud sous Docker Desktop / Windows ---
      # Un dossier Windows monté dans le conteneur ne transmet pas les
      # événements de fichiers (inotify) : sans scrutation, `nest start --watch`
      # ne voit ni les fichiers modifiés ni les fichiers ajoutés par un
      # `git pull`, et l'api continue de servir l'ancien code. Ces deux
      # variables passent le watcher TypeScript (fichiers ET dossiers) en
      # scrutation. Valeurs exactes lues par TypeScript (sys.watchFile /
      # watchDirectory).
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    command: ["npm", "run", "start:dev"]
    # Premier démarrage après `up --build -V` : npm ci dans l'image, puis
    # compilation complète par `nest start --watch` en scrutation (Windows),
    # environ 2 minutes. Avec le délai de grâce de base (20 s + 5 essais),
    # compose déclarait l'api « unhealthy » et ne démarrait ni web ni nginx.
    # Dev uniquement : la recette et la production gardent leur sonde.
    healthcheck:
      start_period: 240s
    volumes:
      - ./apps/api:/app          # live source for hot reload
      - /app/node_modules        # keep the container's node_modules (not the host's)
    ports:
      - "3000:3000"              # optional direct access for debugging
  web:
    build:
      target: development
    environment:
      NODE_ENV: development
      # Même raison que pour l'api : `next dev` (watchpack) passe en scrutation,
      # sinon il garde en mémoire l'ancienne version des fichiers après un pull.
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "dev"]
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "3001:3001"             # http://localhost:3001 hits the web container directly
  # --- Mailhog (US-CPT-05) : serveur SMTP de développement ---
  # Capte tous les emails émis par l'api (aucun email réel ne part) et les
  # affiche dans une UI web. SMTP interne sur 1025, UI sur http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:latest
    # MÊME réseau que le reste de la stack (défini dans docker-compose.yml) :
    # sans ça Mailhog atterrit sur le réseau "default" et l'api ne peut pas
    # résoudre le nom "mailhog" (erreur getaddrinfo ENOTFOUND mailhog).
    networks: [cert_eet_net]
    ports:
      - "8025:8025"              # UI web — http://localhost:8025
