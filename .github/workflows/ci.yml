# INF05 (CI pipeline) — Cert_EET
# Runs on every push to main and every PR targeting main.
# Order: install -> generate test keys -> lint -> unit tests + coverage -> integration tests -> upload coverage.
# Scope for now: apps/api only (backend). apps/web can be added later.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  api:
    name: API (lint + tests + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cert_eet
          POSTGRES_PASSWORD: cert_eet
          POSTGRES_DB: cert_eet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cert_eet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: cert_eet
      DB_PASSWORD: cert_eet
      DB_NAME: cert_eet
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      ADMIN_EMAIL: admin@cert-eet.test
      ADMIN_PASSWORD: ChangeMe_CI_123
      JWT_PRIVATE_KEY_PATH: /tmp/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /tmp/jwt_public.pem
      # --- Email / SMTP (US-CPT-05) ---
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAIL_FROM: "Cert_EET <ci@cert-eet.test>"
      APP_BASE_URL: "http://localhost:3001"
      # --- OAuth Google (US-AUTH-14) ---
      # GoogleStrategy s'instancie au boot d'AppModule, et la validation Joi
      # exige CLIENT_ID/SECRET (fail-fast). L'e2e ne declenche jamais le vrai
      # flux OAuth, donc des valeurs factices suffisent pour laisser l'app demarrer.
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret
      GOOGLE_CALLBACK_URL: "http://localhost:3001/api/auth/oauth/google/callback"
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies (clean, from lockfile)
        run: npm ci
      - name: Generate throwaway RS256 keys for tests
        run: |
          openssl genrsa -out "$JWT_PRIVATE_KEY_PATH" 2048
          openssl rsa -in "$JWT_PRIVATE_KEY_PATH" -pubout -out "$JWT_PUBLIC_KEY_PATH"
      - name: Lint
        run: npm run lint
      - name: Unit tests + coverage
        run: npm run test:cov -- --passWithNoTests
      - name: Run database migrations
        run: npm run migration:run
      - name: Integration tests
        run: npm run test:e2e -- --passWithNoTests
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: apps/api/coverage
          if-no-files-found: ignore
