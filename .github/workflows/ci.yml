# INF05 (CI pipeline) — Cert_EET
# Runs on every push to main and every PR targeting main.
# Order: install -> generate test keys -> lint -> unit tests + coverage -> integration tests -> upload coverage.
# Jobs: « API » (lint, unit, e2e, coverage) and, since the Sprint 3 chores,
# « Web » (TypeScript type check + next lint on apps/web).
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  api:
    name: API (lint + tests + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cert_eet
          POSTGRES_PASSWORD: cert_eet
          POSTGRES_DB: cert_eet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cert_eet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: cert_eet
      DB_PASSWORD: cert_eet
      DB_NAME: cert_eet
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      ADMIN_EMAIL: admin@cert-eet.test
      ADMIN_PASSWORD: ChangeMe_CI_123
      JWT_PRIVATE_KEY_PATH: /tmp/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /tmp/jwt_public.pem
      # --- Email / SMTP (US-CPT-05) ---
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAIL_FROM: "Cert_EET <ci@cert-eet.test>"
      APP_BASE_URL: "http://localhost:3001"
      # --- OAuth Google (US-AUTH-14) ---
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret
      GOOGLE_CALLBACK_URL: "http://localhost:3001/api/auth/oauth/google/callback"
      # --- OAuth GitHub (US-AUTH-14 - 2e fournisseur) ---
      GITHUB_CLIENT_ID: ci-dummy-github-client-id
      GITHUB_CLIENT_SECRET: ci-dummy-github-client-secret
      GITHUB_CALLBACK_URL: "http://localhost:3001/api/auth/oauth/github/callback"
      # --- Stockage objet MinIO (US-ATEL-04, ADR-07) ---
      S3_ENDPOINT: "http://localhost:9000"
      S3_ACCESS_KEY: ci-minio-user
      S3_SECRET_KEY: ci-minio-password
      S3_BUCKET_LIVRABLES: livrables-ci
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json
      # MinIO ne peut pas être un « service » GitHub Actions sans options
      # adaptées : je le lance moi-même, même image que docker-compose.yml
      # (build Bitnami archivée de MinIO RELEASE.2025-04-22), et j'attends la
      # même sonde que son healthcheck.
      - name: Start MinIO (US-ATEL-04)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            bitnamilegacy/minio:2025.4.22
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && echo "MinIO prêt" && exit 0
            sleep 2
          done
          docker logs minio; exit 1
      - name: Install dependencies (clean, from lockfile)
        run: npm ci
      - name: Generate throwaway RS256 keys for tests
        run: |
          openssl genrsa -out "$JWT_PRIVATE_KEY_PATH" 2048
          openssl rsa -in "$JWT_PRIVATE_KEY_PATH" -pubout -out "$JWT_PUBLIC_KEY_PATH"
      - name: Lint
        run: npm run lint
      - name: Unit tests + coverage
        run: npm run test:cov -- --passWithNoTests
      - name: Run database migrations
        run: npm run migration:run
      # En série (--runInBand, dans le script test:e2e) : toutes les suites
      # partagent la même base, et le balayage des tentatives échues appelé par
      # une suite clôturait les fixtures d'une autre exécutée en parallèle.
      - name: Integration tests
        run: npm run test:e2e -- --passWithNoTests
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: apps/api/coverage
          if-no-files-found: ignore
  # Chore Sprint 3 — le frontend est vérifié à chaque PR : vérification des
  # types (tsc) puis ESLint (next lint). Aucun service, aucun secret.
  web:
    name: Web (tsc + next lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies (clean, from lockfile)
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npm run lint
  # IA — prédiction du risque : tests du service ml (FastAPI + modèle
  # LightGBM), puis construction de son image Docker et contrôle de santé.
  # Indépendant des jobs API et Web. Le test anti-fuite de ml/risque est
  # sauté proprement : les CSV OULAD ne sont jamais versionnés.
  ml:
    name: ML (pytest + image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ml/service/requirements-test.txt
      - name: Install dependencies (versions exactes)
        run: pip install -r service/requirements-test.txt
      - name: Tests (pytest)
        run: python -m pytest -rs
      - name: Build de l'image du service ml
        run: docker build -t cert_eet-ml:ci -f service/Dockerfile .
      - name: Démarrage et contrôle de santé de l'image
        run: |
          docker run -d --name ml --read-only --tmpfs /tmp -p 8000:8000 cert_eet-ml:ci
          for i in $(seq 1 30); do
            etat=$(docker inspect --format '{{.State.Health.Status}}' ml)
            [ "$etat" = "healthy" ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' ml | grep -qx healthy || { docker logs ml; exit 1; }
          curl -fs http://localhost:8000/sante
          [ "$(docker exec ml id -u)" != "0" ] || { echo "Le service tourne en root"; exit 1; }
          docker exec ml sh -c 'test ! -e /app/donnees && test ! -e /app/notebooks' || { echo "Données présentes dans l'image"; exit 1; }
