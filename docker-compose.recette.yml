# Cert_EET — INF03 — RECETTE (staging) override
# Production image stage, restart policy, no source bind-mounts.
#   docker compose -f docker-compose.yml -f docker-compose.recette.yml up --build -d

services:
  api:
    # Image publiée par le CD (INF06). `pull` la récupère depuis GHCR ;
    # `build` reste disponible en secours (construction locale sur l'hôte).
    image: ghcr.io/iyed519/cert_eet-api:latest
    build:
      target: production
    environment:
      NODE_ENV: production
    restart: unless-stopped

  web:
    # Image publiée par le CD (INF06). Voir api ci-dessus.
    image: ghcr.io/iyed519/cert_eet-web:latest
    build:
      target: production
    environment:
      NODE_ENV: production
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  nginx:
    restart: unless-stopped

  minio:
    restart: unless-stopped

  # Service ml : construit sur l'hôte depuis ml/ (pas d'image publiée par le CD).
  ml:
    restart: unless-stopped
