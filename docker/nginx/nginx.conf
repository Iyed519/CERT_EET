# Cert_EET — INF03 (US-INFRA-03) + US-AUTH-13 — Nginx reverse proxy (DMZ)
# /     -> web  (Next.js)
# /api/ -> api  (NestJS)        TLS terminé ici.
# Monté en /etc/nginx/conf.d/default.conf (donc DANS le bloc http{} par défaut :
# les directives limit_req_zone / map ci-dessous sont au niveau http).
#
# CERTIFICATS : chemins de REMPLACEMENT uniquement. Les fichiers réels
# (fullchain.pem, privkey.pem, chain.pem) sont déposés sur l'hôte dans
# ./docker/nginx/certs/ (monté en lecture seule) et ne sont JAMAIS versionnés.
# Voir docs/DEPLOIEMENT_RECETTE.md §7.

server_tokens off;

# --- US-AUTH-13 : limitation de débit à l'entrée (première barrière) ---
# Par adresse IP du client. L'api applique ensuite ses propres limites, plus
# fines (par route), et journalise les refus.
limit_req_zone $binary_remote_addr zone=auth_sensible:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=verification_publique:10m rate=30r/m;
# US-AUTH-17 : le rafraîchissement de session a sa propre zone, alignée sur la
# limite de l'api (120 / min / IP) : chaque rechargement de page restaure la
# session par /api/auth/refresh ; dans la zone des connexions (30 / min), une
# salle de cours qui recharge ses pages serait déconnectée. Le refresh exige un
# cookie signé valide : rien à deviner, la force brute n'y a pas de sens.
limit_req_zone $binary_remote_addr zone=rafraichissement:10m rate=120r/m;
limit_req_status 429;
limit_req_log_level warn;

# --- HTTP (port 80) : sonde de santé + redirection permanente vers HTTPS ---
server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (port 443) : terminaison TLS + routage ---
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # Chemins de remplacement (voir en tête) — aucun certificat dans le dépôt.
    ssl_certificate         /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key     /etc/nginx/certs/privkey.pem;

    # Profil « intermediate » (Mozilla) : TLS 1.2 et 1.3 seulement, suites
    # AEAD à confidentialité persistante (ECDHE), le client choisit en TLS 1.3.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CertEET_SSL:10m;
    ssl_session_tickets off;

    # Agrafage OCSP : à activer avec un certificat d'une autorité publique
    # (inutile avec le certificat auto-signé de recette).
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/certs/chain.pem;

    # US-AUTH-13 — en-têtes de sécurité communs (api et web). « always » : aussi
    # sur les réponses d'erreur. HSTS : 2 ans, sous-domaines (pas de « preload »,
    # engagement irréversible à décider par l'exploitant).
    # Les applications posent aussi ces en-têtes (défense en profondeur quand on
    # les joint sans nginx) : on masque leur copie pour n'en émettre qu'une.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    # Corps de requête : 10 Mo par défaut (JSON borné à 100 ko par l'api,
    # imports CSV, captures) ; les routes de dépôt de fichiers ont leur bloc.
    client_max_body_size 10m;
    client_body_timeout 60s;

    # ---- Dépôts de fichiers (livrables, supports IA, ressources) ----
    # Jusqu'à 1 Gio (ressources de module, US-FORM-06) ; l'api applique ensuite
    # les limites propres à chaque route.
    location ~ ^/api/(ateliers/[^/]+/livrable|modules/[^/]+/supports|modules/[^/]+/ressources/fichiers)$ {
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # ---- Authentification sensible : limitation à l'entrée ----
    location ~ ^/api/auth/(login|register|verify-email|mfa/verify|forgot-password|reset-password)$ {
        limit_req zone=auth_sensible burst=20 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Rafraîchissement de session (US-AUTH-17) : zone dédiée ----
    location = /api/auth/refresh {
        limit_req zone=rafraichissement burst=60 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Vérification publique de certificat (US-CERT-05) ----
    location /api/verification/ {
        limit_req zone=verification_publique burst=10 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API -> NestJS ----
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events, ADR-06 / US-IA-07)
        proxy_set_header Connection '';
        proxy_buffering   off;
        proxy_cache       off;
        proxy_read_timeout 3600s;
    }

    # ---- Frontend -> Next.js ----
    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev hot-reload (WebSocket) pass-through
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
