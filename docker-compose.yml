# Cert_EET — INF03 (US-INFRA-03) — Base Docker Compose
# Starts api + web + postgres + redis + minio + ml + nginx in the correct order, one command.
#
#   Dev     : docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   Recette : docker compose -f docker-compose.yml -f docker-compose.recette.yml up --build -d
#
# Only nginx is published to the host (80/443). Everything else talks on the
# private docker network. The API waits for Postgres + Redis to be healthy.

name: cert-eet

services:
  postgres:
    image: pgvector/pgvector:pg16          # Postgres 16 + pgvector ready (ADR-04/05, RAG later)
    container_name: cert_eet_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data    # persisted on the host (ADR-07)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [cert_eet_net]

  redis:
    image: redis:7-alpine
    container_name: cert_eet_redis
    command: ["redis-server", "--appendonly", "yes"]   # AOF persistence (ADR-08)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cert_eet_net]

  # --- MinIO (US-ATEL-04, ADR-07) : stockage objet S3 des livrables ---
  # Privé au réseau docker (aucun port publié) : seule l'api y accède. Le
  # bucket est créé par l'api au démarrage s'il manque.
  # Image : MinIO ne publie plus d'images sur Docker Hub ni quay.io (fin
  # 2025). J'utilise la build Bitnami archivée de la même version de MinIO
  # (RELEASE.2025-04-22), figée : elle démarre le serveur toute seule, sous un
  # utilisateur non root, données dans /bitnami/minio/data.
  minio:
    image: bitnamilegacy/minio:2025.4.22
    container_name: cert_eet_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/bitnami/minio/data       # livrables persistés sur l'hôte (ADR-07)
    healthcheck:
      # Sonde officielle de MinIO (la CI attend exactement la même URL).
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [cert_eet_net]

  # --- Service ml (IA — prédiction des apprenants à risque) ---
  # FastAPI + modèle LightGBM (ml/modeles/risque_v1). Réseau interne
  # uniquement : aucun port publié, jamais proxifié par nginx ; seule l'api
  # l'appelle. L'api ne dépend PAS de son démarrage : s'il est arrêté, lent ou
  # en erreur, seules les règles d'alerte s'appliquent (repli silencieux).
  ml:
    build:
      context: ./ml
      dockerfile: service/Dockerfile
    container_name: cert_eet_ml
    environment:
      ML_TAILLE_LOT_MAX: "500"
    read_only: true                       # le service n'écrit rien sur disque
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/sante', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks: [cert_eet_net]

  api:
    build:
      context: ./apps/api
      target: production
    container_name: cert_eet_api
    environment:
      NODE_ENV: production
      PORT: 3000
      # --- DB / Redis connection (consumed from US-INFRA-04 onward) ---
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # --- Bootstrap admin (seed INF04) ---
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # --- JWT RS256 keys (INF07) ---
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      # --- Stockage objet MinIO / S3 (US-ATEL-04, ADR-07) ---
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_LIVRABLES: ${S3_BUCKET_LIVRABLES:-livrables}
      # --- Génération de questions par IA (US-IA-03, ADR-05) ---
      # Clé lue depuis le .env local (jamais commitée). US-IA-09 : la clé prime
      # (Claude est appelé dès qu'elle est là) ; sans clé, l'IA est signalée
      # « non configurée » dans l'interface, jamais de réponse d'exemple.
      LLM_FOURNISSEUR: ${LLM_FOURNISSEUR:-}
      LLM_MODELE: ${LLM_MODELE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # --- IA : prédiction du risque (service ml, réseau interne) ---
      # Calcul périodique des scores ; si ml est arrêté, seules les règles
      # d'alerte s'appliquent. Pas de depends_on : l'api démarre sans ml.
      ML_URL: http://ml:8000
      ML_DELAI_MS: ${ML_DELAI_MS:-3000}
      RISQUE_BALAYAGE_ACTIF: ${RISQUE_BALAYAGE_ACTIF:-true}
      RISQUE_INTERVALLE_MINUTES: ${RISQUE_INTERVALLE_MINUTES:-1440}
      RISQUE_PREMIER_CALCUL_SECONDES: ${RISQUE_PREMIER_CALCUL_SECONDES:-60}
    volumes:
      - ./secrets:/run/secrets:ro          # RS256 keys, read-only (INF07)
    depends_on:
      postgres:
        condition: service_healthy        # API waits for DB ready (INF03 acceptance criterion)
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [cert_eet_net]

  web:
    build:
      context: ./apps/web
      target: production
    container_name: cert_eet_web
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [cert_eet_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: cert_eet_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cert_eet_net]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  cert_eet_net:
    driver: bridge